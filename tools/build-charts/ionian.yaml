# Mar Ionio — l'area di navigazione di serie.
# Per aggiungerne un'altra: copia questo file, cambia riquadro e porti,
# lancia `npm run charts`. Le coste arrivano dai dati Natural Earth.

name: Mar Ionio
out: src/data/ionian.json

# riquadro geografico: lon_min, lat_min, lon_max, lat_max
bbox: [20.28, 37.92, 21.10, 39.06]

# Le distanze vengono divise per questo fattore. A grandezza naturale
# una traversata durerebbe ore: forme e posizioni restano vere, le
# distanze si comprimono.
scale: 6

min_area_km2: 0.25      # sotto questa soglia gli scogli si ignorano
min_clearance: 170      # corridoio navigabile minimo attorno alle coste
min_port_gap: 700       # porti più vicini di così vengono scartati

# Nomi delle terre, riconosciute dal loro centro
names:
  Grecia:    {lat: 38.782, lon: 20.960}
  Cefalonia: {lat: 38.227, lon: 20.575}
  Lefkada:   {lat: 38.709, lon: 20.647}
  Itaca:     {lat: 38.403, lon: 20.687}
  Preveza:   {lat: 39.009, lon: 20.749}
  Kalamos:   {lat: 38.624, lon: 20.909}
  Meganisi:  {lat: 38.647, lon: 20.770}
  Kastos:    {lat: 38.573, lon: 20.913}

# Isole sotto la risoluzione del dato, ricostruite alla posizione reale
extra_islands:
  - {name: Skorpios, lat: 38.7005, lon: 20.7500, rlat: 0.0050, rlon: 0.0045}

start: {lat: 38.700, lon: 20.760}

marks:
