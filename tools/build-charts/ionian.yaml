  - {name: Spartochori, lat: 38.668, lon: 20.792}
  - {name: Vathy Itaca, lat: 38.360, lon: 20.742}
  - {name: Fiskardo,    lat: 38.462, lon: 20.592}
  - {name: Sivota,      lat: 38.600, lon: 20.692}
  - {name: Palairos,    lat: 38.795, lon: 20.870}

ports:
